<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vienna Local Guide</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sec: #94a3b8;
            --accent: #fbbf24;
            --food-color: #ef4444;
            --sight-color: #3b82f6;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* Progress Bar */
        .progress-container { width: 100%; height: 4px; background: #334155; position: fixed; top: 0; z-index: 9999; }
        .progress-bar { height: 4px; background: var(--accent); width: 0%; border-radius: 0 2px 2px 0; }

        /* App Header & Tabs */
        .header {
            position: sticky;
            top: 4px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 15px 15px 10px;
            border-bottom: 1px solid #334155;
        }

        h1 { margin: 0 0 15px 0; font-size: 1.4rem; text-align: center; color: var(--accent); letter-spacing: 0.5px; }

        .tabs { display: flex; gap: 10px; }
        
        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sec);
            background: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active.food { background: var(--food-color); color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .tab-btn.active.sights { background: var(--sight-color); color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        /* Cards Layout */
        .container { padding: 15px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
            transition: opacity 0.3s;
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
        }
        .card.type-food::before { background: var(--food-color); }
        .card.type-sight::before { background: var(--sight-color); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        
        /* Checkbox Styling */
        .title-group { display: flex; align-items: flex-start; gap: 12px; flex-grow: 1; }
        input[type="checkbox"].visit-cb {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--accent);
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .card-title { font-size: 1.25rem; font-weight: 800; margin: 0; color: #fff; line-height: 1.3; transition: all 0.3s; }
        .card-cost { background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; margin-left: 10px; }

        .card-desc { font-size: 0.95rem; line-height: 1.5; color: var(--text-sec); margin: 0 0 15px 0; }
        
        .card-tip {
            background: rgba(251, 191, 36, 0.1);
            color: #fcd34d;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }

        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; text-align: center; 
            text-decoration: none; font-size: 0.9rem; border: none; cursor: pointer;
        }
        .btn-audio { background: #334155; color: #fff; }
        .btn-map { background: var(--text-main); color: var(--bg-dark); }
        .btn-audio.playing { background: #ef4444; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>

    <div class="header">
        <h1>🇦🇹 Vienna Local Guide</h1>
        <div class="tabs">
            <button class="tab-btn sights active" onclick="setFilter('sights')">🏛️ Αξιοθέατα</button>
            <button class="tab-btn food" onclick="setFilter('food')">🍔 Φαγητό</button>
        </div>
    </div>

    <div class="container" id="content"></div>

    <script>
        // Δεδομένα με ΟΛΑ τα νέα αξιοθέατα, μεταφορές και μοναδικά IDs για τα checkboxes
        const placesData = [
            // --- ΑΞΙΟΘΕΑΤΑ & ΔΙΑΔΡΟΜΕΣ ---
            { id: "opera", type: "sights", name: "Κρατική Όπερα (Staatsoper)", cost: "Δωρεάν εξωτερικά", tip: "🚇 <b>Μετρό:</b> Στάση Karlsplatz (Γραμμές U1, U2, U4). <br>🚃 <b>Τραμ:</b> Γραμμές 1 ή 2.", desc: "Ένα από τα πιο διάσημα κτίρια όπερας στον κόσμο. Εξωτερικά μαγευτικό, μπορείτε να το δείτε κάνοντας και τον γύρο της Ringstrasse.", mapQuery: "Vienna State Opera" },
            { id: "parlament", type: "sights", name: "Αυστριακό Κοινοβούλιο", cost: "Δωρεάν", tip: "🚇 <b>Μετρό:</b> Στάση Rathaus (U2) ή Volkstheater (U2, U3). <br>🚃 <b>Τραμ:</b> Γραμμές 1 ή 2.", desc: "Εντυπωσιακό κτίριο σε νεοκλασικό στυλ που θυμίζει αρχαίο ελληνικό ναό με το εντυπωσιακό άγαλμα της Αθηνάς μπροστά.", mapQuery: "Austrian Parliament Building" },
            { id: "rathaus", type: "sights", name: "Δημαρχείο (Rathaus)", cost: "Δωρεάν", tip: "🚇 <b>Μετρό:</b> Στάση Rathaus (Γραμμή U2).", desc: "Γοτθικό αριστούργημα. Την τεράστια πλατεία του αξίζει να τη δείτε, καθώς συχνά φιλοξενεί εκδηλώσεις (όπως το παγοδρόμιο Eistraum).", mapQuery: "Rathaus Vienna" },
            { id: "hofburg", type: "sights", name: "Παλάτι Hofburg", cost: "Δωρεάν εξωτερικά", tip: "🚇 <b>Μετρό:</b> Στάση Herrengasse (U3) ή Stephansplatz (U1, U3).", desc: "Η χειμερινή έδρα των Αψβούργων και το παλάτι της Σίσσυ. Περιπλανηθείτε ελεύθερα στις μεγάλες αυλές του παλατιού και την Michaelerplatz.", mapQuery: "Hofburg Vienna" },
            { id: "museums", type: "sights", name: "Μουσεία Τέχνης & Φυσικής Ιστορίας", cost: "Δωρεάν η πλατεία", tip: "🚇 <b>Μετρό:</b> Στάση Volkstheater (Γραμμές U2, U3).", desc: "Δύο πανομοιότυπα, τεράστια κτίρια που στέκονται το ένα απέναντι από το άλλο στην πλατεία Maria-Theresien-Platz. Εξαιρετικό σημείο για φωτογραφίες.", mapQuery: "Maria-Theresien-Platz Vienna" },
            { id: "karlskirche", type: "sights", name: "Ναός Αγίου Καρόλου (Karlskirche)", cost: "Δωρεάν εξωτερικά", tip: "🚇 <b>Μετρό:</b> Στάση Karlsplatz (Γραμμές U1, U2, U4) έξοδος Resselpark.", desc: "Ίσως η πιο εντυπωσιακή μπαρόκ εκκλησία της πόλης με τον τεράστιο τρούλο της και τις δύο στήλες. Βρίσκεται μέσα στο πάρκο.", mapQuery: "Karlskirche Vienna" },
            { id: "belvedere", type: "sights", name: "Ανάκτορα Belvedere", cost: "Δωρεάν (Κήποι)", tip: "🚇 <b>Μετρό:</b> U1 (Hauptbahnhof) <br>🚃 <b>Τραμ:</b> Γραμμή D (Στάση Schloss Belvedere).", desc: "Η βόλτα ανάμεσα στο Πάνω (Upper) και το Κάτω (Lower) παλάτι Belvedere είναι εκπληκτική. Οι κήποι είναι ανοιχτοί για το κοινό εντελώς δωρεάν.", mapQuery: "Belvedere Palace Vienna" },
            { id: "stephansdom", type: "sights", name: "Καθεδρικός Αγ. Στεφάνου", cost: "Δωρεάν κεντρικός χώρος", tip: "🚇 <b>Μετρό:</b> Στάση Stephansplatz (Γραμμές U1, U3).", desc: "Το σύμβολο της Βιέννης στο κέντρο της πόλης. Μπορείτε να μπείτε δωρεάν στον κεντρικό χώρο. Για ανάβαση στους πύργους έχει αντίτιμο (περίπου 6€).", mapQuery: "Stephansdom Vienna" },
            { id: "prater", type: "sights", name: "Prater & Τροχός Riesenrad", cost: "Δωρεάν η είσοδος", tip: "🚇 <b>Μετρό:</b> Στάση Praterstern (Γραμμές U1, U2).", desc: "Το τεράστιο λούνα παρκ της Βιέννης. Η βόλτα στον χώρο είναι δωρεάν. Πληρώνετε μεμονωμένα αν θέλετε να μπείτε στα παιχνίδια ή τον ιστορικό Τροχό.", mapQuery: "Prater Vienna" },
            { id: "schonbrunn", type: "sights", name: "Κήποι Schönbrunn", cost: "Δωρεάν", tip: "🚇 <b>Μετρό:</b> Στάση Schönbrunn (Γραμμή U4).", desc: "Η θερινή κατοικία των Αψβούργων. Η βόλτα στους αχανείς κήπους είναι μαγική. Ανεβείτε τον λόφο μέχρι την αψίδα Gloriette για πανοραμική θέα.", mapQuery: "Schonbrunn Palace Vienna" },
            { id: "hundertwasser", type: "sights", name: "Hundertwasserhaus", cost: "Δωρεάν", tip: "🚃 <b>Τραμ:</b> Γραμμή 1, κατεβαίνετε στη στάση Hetzgasse.", desc: "Μια πολυκατοικία βγαλμένη από παραμύθι. Δεν έχει ίσιες γραμμές, είναι βαμμένη με έντονα χρώματα και έχει δέντρα που βγαίνουν μέσα από τα μπαλκόνια!", mapQuery: "Hundertwasserhaus Vienna" },
            { id: "grinzing", type: "sights", name: "Χωριό Grinzing (Κρασί)", cost: "Δωρεάν βόλτα", tip: "🚃 <b>Τραμ:</b> Γραμμή 38 (την παίρνετε από τη στάση μετρό Schottentor).", desc: "Πανέμορφη γειτονιά με παραδοσιακές ταβέρνες (Heuriger) και αμπελώνες. Το ιδανικό μέρος για να δείτε μια άλλη, πιο γραφική πλευρά της Βιέννης.", mapQuery: "Grinzing Vienna" },
            { id: "kahlenberg", type: "sights", name: "Λόφος Kahlenberg (Θέα)", cost: "Δωρεάν", tip: "🚌 <b>Λεωφορείο:</b> Γραμμή 38A (το παίρνετε από τη στάση μετρό Heiligenstadt - U4).", desc: "Αν θέλετε την απόλυτη πανοραμική θέα της Βιέννης και του Δούναβη από ψηλά. Η διαδρομή μέσα από το δάσος είναι εμπειρία.", mapQuery: "Kahlenberg Vienna" },
            
            // --- ΦΑΓΗΤΟ & ΣΤΕΚΙΑ ΝΤΟΠΙΩΝ ---
            { id: "leberkas", type: "food", name: "Leberkas-Pepi", cost: "~4€", tip: "Ζητήστε το Pepi-Leberkäse με τυρί και λίγη μουστάρδα.", desc: "Το απόλυτο βρώμικο των ντόπιων. Ένα ζεστό, παχύ κομμάτι ψητού πατέ κρέατος μέσα σε τραγανό ψωμάκι. Γρήγορο και χορταστικό.", mapQuery: "Leberkas-Pepi Vienna" },
            { id: "hohermarkt", type: "food", name: "Würstelstand am Hohen Markt", cost: "~5€", tip: "Κομμένο σε φέτες (geschnitten) με μαύρο ψωμί και φρέσκο χρένο.", desc: "Η πιο διάσημη καντίνα για λουκάνικα. Το Käsekrainer είναι χοντρό λουκάνικο γεμιστό με τυρί που λιώνει και κάνει κρούστα.", mapQuery: "Würstelstand am Hohen Markt Vienna" },
            { id: "quell", type: "food", name: "Gasthaus Quell", cost: "~15-20€", tip: "Δοκιμάστε το Schweinsbraten (χοιρινό ψητό με τραγανή πέτσα).", desc: "Αυθεντικό Wirtshaus. Ξύλινη επένδυση, καθόλου τουρίστες, μεγάλες μερίδες και εξαιρετική τοπική βαρελίσια μπύρα.", mapQuery: "Gasthaus Quell Vienna" },
            { id: "schubel", type: "food", name: "Heuriger Schübel-Auer", cost: "~20€", tip: "Πάρτε Liptauer (πικάντικο άλειμμα τυριού) και νέο κρασί παραγωγής τους.", desc: "Παραδοσιακή κρασοταβέρνα στα περίχωρα (Nußdorf). Οι ντόπιοι έρχονται εδώ για κρασί και κρύα πιάτα από τον μπουφέ.", mapQuery: "Heuriger Schübel-Auer Vienna" },
            { id: "jelinek", type: "food", name: "Café Jelinek", cost: "~8€", tip: "Παραγγείλετε ένα Kaiserschmarrn (κομματιασμένες τηγανίτες - Το γλυκό του Αυτοκράτορα).", desc: "Ξεχάστε τα τουριστικά καφέ. Εδώ θα βρείτε φθαρμένους βελούδινους καναπέδες, μια ξυλόσομπα στη μέση και ντόπιους να διαβάζουν εφημερίδα.", mapQuery: "Cafe Jelinek Vienna" },
            { id: "steman", type: "food", name: "Steman", cost: "~18€", tip: "Εδώ θα φάτε το πιο 'τίμιο' μοσχαρίσιο Wiener Schnitzel.", desc: "Κλασικό στέκι που υπάρχει πάνω από 100 χρόνια. Εξαιρετικό φαγητό, μακριά από τις εξωφρενικές τιμές του κέντρου.", mapQuery: "Steman Vienna" }
        ];

        let currentFilter = 'sights'; // Ξεκινάει με τα Αξιοθέατα
        let synth = window.speechSynthesis;
        let currentUtterance = null;
        let playingIndex = -1;

        // Progress Bar
        window.onscroll = () => {
            let winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById("myBar").style.width = (winScroll / height) * 100 + "%";
        };

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn.${filter}`).classList.add('active');
            stopAudio();
            renderCards();
        }

        // Διαχείριση των Checkboxes (αποθήκευση στο κινητό)
        function toggleVisited(id) {
            const cb = document.getElementById('cb-' + id);
            const title = document.getElementById('title-' + id);
            
            if (cb.checked) {
                localStorage.setItem('vienna_visited_' + id, 'true');
                title.style.textDecoration = 'line-through';
                title.style.opacity = '0.5';
            } else {
                localStorage.removeItem('vienna_visited_' + id);
                title.style.textDecoration = 'none';
                title.style.opacity = '1';
            }
        }

        function renderCards() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            
            const filteredData = placesData.filter(item => item.type === currentFilter);

            filteredData.forEach((item, index) => {
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;
                const emoji = item.type === 'food' ? '🍔' : '🏛️';
                
                // Έλεγχος αν το έχουμε τικάρει σε προηγούμενο άνοιγμα της εφαρμογής
                const isChecked = localStorage.getItem('vienna_visited_' + item.id) === 'true';
                const checkedAttr = isChecked ? 'checked' : '';
                const titleStyle = isChecked ? 'text-decoration: line-through; opacity: 0.5;' : '';

                container.innerHTML += `
                    <div class="card type-${item.type}">
                        <div class="card-header">
                            <div class="title-group">
                                <input type="checkbox" class="visit-cb" id="cb-${item.id}" onchange="toggleVisited('${item.id}')" ${checkedAttr}>
                                <h2 class="card-title" id="title-${item.id}" style="${titleStyle}">${item.name}</h2>
                            </div>
                            <div class="card-cost">${item.cost}</div>
                        </div>
                        <div class="card-tip">🧭 <b>Οδηγίες:</b> <br>${item.tip}</div>
                        <p class="card-desc">${item.desc}</p>
                        <div class="actions">
                            <button id="audio-btn-${index}" class="btn btn-audio" onclick="toggleAudio(${index}, '${item.desc.replace(/'/g, "\\'")}')">🔊 Ακρόαση</button>
                            <a href="${mapLink}" target="_blank" class="btn btn-map">📍 Χάρτης</a>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAudio(index, text) {
            if (playingIndex === index && synth.speaking) {
                stopAudio();
            } else {
                stopAudio();
                playingIndex = index;
                document.getElementById(`audio-btn-${index}`).classList.add('playing');
                document.getElementById(`audio-btn-${index}`).innerText = "⏹️ Stop";
                
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.lang = 'el-GR';
                currentUtterance.rate = 0.95;
                
                currentUtterance.onend = () => {
                    stopAudio();
                };
                
                synth.speak(currentUtterance);
            }
        }

        function stopAudio() {
            if (synth.speaking) synth.cancel();
            if (playingIndex !== -1) {
                const btn = document.getElementById(`audio-btn-${playingIndex}`);
                if (btn) {
                    btn.classList.remove('playing');
                    btn.innerText = "🔊 Ακρόαση";
                }
                playingIndex = -1;
            }
        }

        // Αρχική φόρτωση
        renderCards();
    </script>
</body>
</html>
