<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienna Local Guide - Ultimate Edition</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sec: #94a3b8;
            --accent: #fbbf24;
            --sights-color: #3b82f6;
            --food-color: #ef4444;
            --cafe-color: #d946ef;
            --shopping-color: #10b981;
            --night-color: #8b5cf6;
            --metro-color: #64748b;
            --travel-color: #f97316;
            /* Official U-Bahn Colors */
            --u1: #E2001A; --u2: #A71C49; --u3: #F68712; --u4: #009640; --u6: #8C6141;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        .progress-container { width: 100%; height: 4px; background: #334155; position: fixed; top: 0; z-index: 9999; }
        .progress-bar { height: 4px; background: var(--accent); width: 0%; border-radius: 0 2px 2px 0; }

        .header { position: sticky; top: 4px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 15px 15px 10px; border-bottom: 1px solid #334155; }
        h1 { margin: 0 0 15px 0; font-size: 1.4rem; text-align: center; color: var(--accent); letter-spacing: 0.5px; }

        .tabs-container { overflow-x: auto; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs { display: flex; gap: 10px; padding-bottom: 5px; width: max-content; }
        
        .tab-btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; color: var(--text-sec); background: #334155; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }

        .tab-btn.active.sights { background: var(--sights-color); color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .tab-btn.active.food { background: var(--food-color); color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .tab-btn.active.cafe { background: var(--cafe-color); color: #fff; box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4); }
        .tab-btn.active.shopping { background: var(--shopping-color); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .tab-btn.active.nightlife { background: var(--night-color); color: #fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .tab-btn.active.metro { background: var(--metro-color); color: #fff; box-shadow: 0 4px 15px rgba(100, 116, 139, 0.4); }
        .tab-btn.active.travel { background: var(--travel-color); color: #fff; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        
        .card.type-sights::before { background: var(--sights-color); }
        .card.type-food::before { background: var(--food-color); }
        .card.type-cafe::before { background: var(--cafe-color); }
        .card.type-shopping::before { background: var(--shopping-color); }
        .card.type-nightlife::before { background: var(--night-color); }
        .card.type-travel::before { background: var(--travel-color); }
        .card.type-metro::before { background: var(--metro-color); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        .title-group { display: flex; align-items: flex-start; gap: 12px; flex-grow: 1; }
        
        .card-title { font-size: 1.25rem; font-weight: 800; margin: 0; color: #fff; line-height: 1.3; transition: all 0.3s; }
        .card-cost { background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; margin-left: 10px; }
        .card-desc { font-size: 0.95rem; line-height: 1.5; color: var(--text-sec); margin: 0 0 15px 0; }
        .card-tip { background: rgba(251, 191, 36, 0.1); color: #fcd34d; padding: 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 15px; border-left: 3px solid var(--accent); }

        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; text-align: center; text-decoration: none; font-size: 0.9rem; border: none; cursor: pointer; }
        .btn-map { background: var(--text-main); color: var(--bg-dark); }

        .qr-image-container { margin-top: 15px; margin-bottom: 15px; text-align: center; padding: 10px; background: #fff; border-radius: 10px; cursor: zoom-in; }
        .qr-image-container img { width: 100%; max-width: 300px; border-radius: 8px; transition: 0.3s; }
        .qr-image-container img:hover { opacity: 0.8; }
        
        .modal { display: none; position: fixed; z-index: 10000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.95); backdrop-filter: blur(5px); }
        .modal-content { margin: auto; display: block; width: 95%; max-width: 600px; border-radius: 8px; }
        .close-modal { position: absolute; top: 15px; right: 25px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close-modal:hover, .close-modal:focus { color: var(--accent); text-decoration: none; cursor: pointer; }

        .route-step { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--accent); }
        .route-step strong { color: #fff; }
    </style>
</head>
<body>

    <div class="progress-container"><div class="progress-bar" id="myBar"></div></div>

    <div class="header">
        <h1>🇦🇹 Vienna Local Guide</h1>
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn travel active" onclick="setFilter('travel')">✈️ Ταξίδι & Κάρτες</button>
                <button class="tab-btn sights" onclick="setFilter('sights')">🏛️ Αξιοθέατα</button>
                <button class="tab-btn food" onclick="setFilter('food')">🍔 Φαγητό</button>
                <button class="tab-btn cafe" onclick="setFilter('cafe')">☕ Καφές</button>
                <button class="tab-btn shopping" onclick="setFilter('shopping')">🛍️ Αγορές</button>
                <button class="tab-btn metro" onclick="setFilter('metro')">🚇 Μετρό & Οδηγίες</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
      <span class="close-modal" onclick="closeModal()">×</span>
      <img class="modal-content" id="img01">
    </div>

    <div class="container" id="content"></div>

    <script>
        const placesData = [
            // --- TRAVEL & CARDS (ΑΝΑΛΥΤΙΚΕΣ ΟΔΗΓΙΕΣ) ---
            { 
                id: "panos", type: "travel", name: "🎫 Κάρτα Μετρό Πάνος", cost: "Ενεργή", 
                tip: "Το εισιτήριο είναι ονομαστικό. Να έχετε πάντα ταυτότητα μαζί σε περίπτωση ελέγχου. Πατήστε στην εικόνα.", 
                desc: "Ισχύει για απεριόριστες διαδρομές (Μετρό, Τραμ, Λεωφορεία) εντός πόλης.", 
                qrUrl: "https://github.com/pzaro/Vienna2026/blob/main/Tichet%20Panos.png?raw=true"
            },
            { 
                id: "lia", type: "travel", name: "🎫 Κάρτα Μετρό Λία", cost: "Ενεργή", 
                tip: "Το εισιτήριο είναι ονομαστικό. Να έχετε πάντα ταυτότητα μαζί. Πατήστε στην εικόνα.", 
                desc: "Ισχύει για απεριόριστες διαδρομές (Μετρό, Τραμ, Λεωφορεία) εντός πόλης.", 
                qrUrl: "https://github.com/pzaro/Vienna2026/blob/main/Tichet%20Lia.png?raw=true"
            },
            { 
                id: "arrival", type: "travel", name: "🛬 Άφιξη: Αεροδρόμιο ➔ Ξενοδοχείο", cost: "+ 2,40€", 
                tip: "Στα κόκκινα μηχανήματα του αεροδρομίου βγάζετε συμπληρωματικό εισιτήριο ~2,40€ επιλέγοντας 'I have a ticket for Vienna'.", 
                desc: "<div class='route-step'><strong>Βήμα 1: Προαστιακός S7 (ή Railjet)</strong><br>Επιβίβαση από Αεροδρόμιο με κατεύθυνση την πόλη. Κατεβαίνετε στη στάση <strong>Wien Mitte / Landstraße</strong>.</div><div class='route-step'><strong>Βήμα 2: Μετρό U4 (Πράσινη Γραμμή)</strong><br>Κατεύθυνση: <strong>Hütteldorf</strong>.<br><u>Στάσεις (6)</u>: Stadtpark, Karlsplatz, Kettenbrückengasse, Pilgramgasse, Margaretengürtel, <strong>Längenfeldgasse (ΑΠΟΒΙΒΑΣΗ)</strong>.</div>Από τον σταθμό, το Hampton by Hilton είναι μόλις 3-4 λεπτά με τα πόδια.", 
                mapQuery: "Hampton by Hilton Vienna City West" 
            },
            { 
                id: "departure", type: "travel", name: "🛫 Αναχώρηση: Ξενοδοχείο ➔ Αεροδρόμιο (12:55)", cost: "+ 2,40€", 
                tip: "Αναχώρηση από το ξενοδοχείο στις 09:30 - 09:45. Μην ξεχάσετε το συμπληρωματικό εισιτήριο στο Wien Mitte!", 
                desc: "<div class='route-step'><strong>Βήμα 1: Μετρό U4 (Πράσινη Γραμμή)</strong><br>Από <strong>Längenfeldgasse</strong>.<br>Κατεύθυνση: <strong>Heiligenstadt</strong>.<br><u>Στάσεις (6)</u>: Margaretengürtel, Pilgramgasse, Kettenbrückengasse, Karlsplatz, Stadtpark, <strong>Landstraße / Wien Mitte (ΑΠΟΒΙΒΑΣΗ)</strong>.</div><div class='route-step'><strong>Βήμα 2: Προαστιακός S7</strong><br>Μέσα στο Wien Mitte ακολουθείτε τις πινακίδες με το αεροπλάνο και το 'S'.<br>Κατεύθυνση: <strong>Flughafen Wien</strong> (ή Wolfsthal).<br><u>Στάσεις (8)</u>: Wien Rennweg, St. Marx, Geiselbergstraße, Zentralfriedhof, Kaiserebersdorf, Schwechat, Mannswörth, <strong>Flughafen Wien (ΑΠΟΒΙΒΑΣΗ)</strong>.</div>" 
            },

            // --- FOOD & SCHNITZEL ---
            { 
                id: "albertinawurst", type: "food", name: "Würstelstand Albertina (Λουκάνικα)", cost: "~6€", 
                tip: "📍 Δίπλα στην Όπερα. Συχνά έχει ουρά, αλλά προχωράει γρήγορα.", 
                desc: "Το πιο διάσημο κιόσκι στο κέντρο για αυθεντικό βιεννέζικο λουκάνικο (Käsekrainer - λουκάνικο γεμιστό με τυρί). Ιδανικό για γρήγορο, αυθεντικό street food.",
                mapQuery: "Bitzinger Würstelstand Albertina"
            },
            { 
                id: "hausmannskost19", type: "food", name: "Hausmannskost19 (Καλό Σνιτσελάδικο)", cost: "~13€ - 20€", 
                tip: "📍 Heiligenstädter Str. 183. Προσοχή: ΚΛΕΙΣΤΑ την Κυριακή! Λειτουργεί Δευτέρα - Σάββατο μέχρι ~18:00.", 
                desc: "Αυθεντικό, παραδοσιακό και μη τουριστικό αυστριακό φαγητό σε πολύ χορταστικές μερίδες! Εξαιρετικό σάντουιτς με σνίτσελ (~4,90€), κλασικό χοιρινό/κοτόπουλο σνίτσελ (12,90€) και αυθεντικό μοσχαρίσιο βιεννέζικο (19,90€). Αγαπημένο των ντόπιων.",
                mapQuery: "Hausmannskost19 Vienna"
            },

            // --- CAFE & BAKERIES ---
            { 
                id: "dermann_mariahilfer", type: "cafe", name: "Φούρνος Der Mann (Mariahilfer)", cost: "Οικονομικό", 
                tip: "📍 Mariahilfer Str. 132. Πολύ κοντά στο ξενοδοχείο σας.", 
                desc: "Η τέλεια 'έξυπνη' επιλογή! Προσφέρει αυθεντικό βιεννέζικο καφέ (Melange), Apfelstrudel, καθώς και σάντουιτς με σνίτσελ σε τιμές γειτονιάς, αποφεύγοντας τα τουριστικά καφέ.", 
                mapQuery: "Der Mann Mariahilfer Str. 132" 
            },
            { 
                id: "dermann_naglergasse", type: "cafe", name: "Φούρνος Der Mann (Στο Κέντρο)", cost: "Οικονομικό", 
                tip: "📍 Naglergasse 11. Ακριβώς δίπλα στην εμπορική οδό Graben.", 
                desc: "Το απόλυτο 'κρυφό' σημείο μέσα στο πανάκριβο ιστορικό κέντρο (κοντά στον Αγ. Στέφανο). Ιδανικό για μια γρήγορη στάση για καφέ και γλυκό ανάμεσα στα αξιοθέατα.", 
                mapQuery: "Der Mann Naglergasse 11" 
            },

            // --- METRO & ROUTES ---
            {
                id: "stephansplatz_to_hotel", type: "metro", name: "🚇 Επιστροφή: Αγ. Στέφανος ➔ Ξενοδοχείο", cost: "Κάρτα Απεριόριστων",
                tip: "Από τη στάση Stephansplatz (Άγιος Στέφανος) στο Hampton by Hilton. Προτείνεται η Επιλογή 1 για λιγότερο περπάτημα.",
                desc: "<div class='route-step'><strong>Επιλογή 1: Αλλαγή (Το πιο ξεκούραστο)</strong><br>1. Μπαίνετε στην <strong>U1 (Κόκκινη)</strong> προς <em>Oberlaa / Reumannplatz</em>.<br>2. Κατεβαίνετε στην αμέσως επόμενη στάση (1 στάση): <strong>Karlsplatz</strong>.<br>3. Ακολουθείτε τις πράσινες ταμπέλες για την <strong>U4 (Πράσινη)</strong> προς <em>Hütteldorf</em>.<br>4. Μετά από 4 στάσεις (Kettenbrückengasse, Pilgramgasse, Margaretengürtel) κατεβαίνετε <strong>Längenfeldgasse</strong>.</div><br><div class='route-step'><strong>Επιλογή 2: Απευθείας U3 (Περισσότερο περπάτημα)</strong><br>1. Μπαίνετε στην <strong>U3 (Πορτοκαλί)</strong> προς <em>Ottakring</em>.<br>2. Περνάτε 4 στάσεις (Herrengasse, Volkstheater, Neubaugasse, Zieglergasse).<br>3. Κατεβαίνετε (5η στάση): <strong>Westbahnhof</strong>.<br>4. Από εκεί περπατάτε ~12 λεπτά μέχρι το ξενοδοχείο (ή παίρνετε την καφέ U6 για 1 στάση μέχρι Gumpendorfer Str.).</div>"
            },

            // --- SIGHTS (ΕΝΔΕΙΚΤΙΚΑ) ---
            { 
                id: "hundertwasser", type: "sights", name: "Hundertwasserhaus", cost: "Εξωτερικά Δωρεάν", 
                tip: "🚃 Τραμ: Γραμμή 1 ➔ Στάση Hetzgasse.", 
                desc: "Μια πολυκατοικία-διαμαρτυρία ενάντια στη μοντέρνα αρχιτεκτονική. Δεν υπάρχει ούτε μία ευθεία γραμμή, ενώ εκατοντάδες δέντρα φυτρώνουν μέσα από τα μπαλκόνια!", 
                mapQuery: "Hundertwasserhaus Vienna" 
            },
            { 
                id: "stephansdom", type: "sights", name: "Καθεδρικός Αγ. Στεφάνου", cost: "Δωρεάν / Πύργοι ~7€", 
                tip: "🚇 Μετρό: Στάση Stephansplatz (U1, U3)", 
                desc: "Το σύμβολο της Βιέννης με την περίτεχνη στέγη από 230.000 πολύχρωμα κεραμίδια.", 
                mapQuery: "Stephansdom Vienna" 
            }
        ];

        function renderCards(filterType) {
            const container = document.getElementById('content');
            container.innerHTML = ''; 
            
            const filteredData = placesData.filter(place => place.type === filterType);
            
            if (filteredData.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-sec); margin-top: 20px;">Δεν έχουν προστεθεί σημεία σε αυτή την κατηγορία ακόμα.</p>';
                return;
            }

            filteredData.forEach(place => {
                const card = document.createElement('div');
                card.className = `card type-${place.type}`;
                
                let qrHtml = '';
                if (place.qrUrl) {
                    qrHtml = `<div class="qr-image-container" onclick="openModal('${place.qrUrl}')"><img src="${place.qrUrl}" alt="${place.name}"></div>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="title-group">
                            <h2 class="card-title">${place.name}</h2>
                        </div>
                        <span class="card-cost">${place.cost}</span>
                    </div>
                    ${qrHtml}
                    <div class="card-tip">${place.tip}</div>
                    <p class="card-desc">${place.desc}</p>
                    <div class="actions">
                        ${place.mapQuery ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.mapQuery)}" target="_blank" class="btn btn-map">📍 Άνοιγμα στο Χάρτη</a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setFilter(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn.${type}`).classList.add('active');
            renderCards(type);
        }

        function openModal(imgSrc) {
            document.getElementById("imageModal").style.display = "block";
            document.getElementById("img01").src = imgSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        setFilter('travel');
    </script>
</body>
</html>
